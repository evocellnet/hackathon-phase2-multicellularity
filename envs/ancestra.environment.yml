# Conda environment for Ancestra (frozen method freeze-v1): Python package dependencies and the
# external programs the pipeline calls. Versions are the ones pinned in the research repo's
# envs/orth.lock.txt (the environment all reported results were produced in, linux-64).
#
#   mamba env create -n ancestra -f environment.yml && conda activate ancestra
#   pip install -e . --no-deps
#
# External programs used at run time:
#   diamond  S0 family clustering, S2 in-family scoring        (always)
#   mmseqs2  S2 re-alignment of pairs DIAMOND missed           (always; default hybrid backend)
#   famsa + fasttree  local gene trees of the `accurate` preset (accurate only)
#   foldseek only for the optional --family-rescue 3di|both    (off by default)
# pyham is only used by scripts/verify_orthoxml.py and ancestra.orthoxml.check_pyham.
name: ancestra
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11.18
  - numpy=1.26.4
  - scipy=1.12.0
  - pandas=2.3.3
  - pyarrow=23.0.0
  - lxml=6.1.3
  - numba=0.68.0
  - llvmlite=0.50.0
  - python-igraph=1.0.0
  - leidenalg=0.12.0
  - pyham=1.1.11
  - diamond=2.2.8
  - mmseqs2=18.8cc5c
  - famsa=2.4.1
  - fasttree=2.2.0
  - foldseek=10.941cd33
  - pytest=9.1.1
  - pip
  - setuptools
